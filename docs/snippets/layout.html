<!-- ============================================================
     ハナハナカウンターの index.html の骨組み（<head> と <body> の HTML 部分）。
     ui-base.css を <style> に入れ、tap-and-haptic.js などを <script> に入れて使う。
     モーダルは同じ z-index なので、HTML の後ろに置いたものほど手前に重なる（開く順に並べる）
     ============================================================ -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 拡大させない（ダブルタップ・ピンチ）。viewport-fit=cover でノッチの下まで使い、余白は safe-area で取る -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>パチンコカウンター</title>
    <!-- 画像出力を使うときだけ -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        /* ui-base.css をここに */
    </style>
</head>
<body>

<div class="header">
    <div class="header-icon" onclick="/* 左の画面を開く */">🔍</div>
    <!-- 中身だけ書き換える（振動用ラベルを描き直しで消さない） -->
    <div class="header-title" id="disp-machine"><span id="disp-machine-name">---</span></div>
    <div class="header-icon" onclick="openModal('setting-modal')">⚙️</div>
</div>

<div class="container">
    <div id="main-ui"></div>
</div>
<!-- 押したボタンの下の増減（メイン画面の外の層。描き直しで消えない） -->
<div id="tap-delta-layer"></div>

<!-- 設定（⚙️）。左上の🔑で管理画面 -->
<div id="setting-modal" class="modal">
    <div class="modal-header">
        <div class="header-icon" onclick="openModal('admin-modal')">🔑</div>
        <div class="modal-title">設定</div>
        <div class="header-icon" onclick="closeModal('setting-modal')">✕</div>
    </div>
    <div class="modal-body">
        <p class="section-title">＜機種選択＞</p>
        <div class="grid">
            <select class="val-input" style="background:#333; padding:5px;" id="machine-select" onchange="updateMachine()">
                <!-- <option value="xxx">機種名</option> -->
            </select>
        </div>
        <!-- 設定は1行に2つ -->
        <div class="setting-pair">
            <div class="setting-item">
                <p class="section-title">＜入力モード＞</p>
                <div class="grid grid-2">
                    <div class="cell" id="btn-mode-tap" onclick="setInputMode('tap')"><div class="label-large">タップ</div></div>
                    <div class="cell" id="btn-mode-input" onclick="setInputMode('input')"><div class="label-large">入力</div></div>
                </div>
            </div>
            <div class="setting-item">
                <!-- もう1つの設定 -->
            </div>
        </div>
        <button onclick="exportData()" class="export-btn">データ保存・画像出力</button>
        <button onclick="resetAll()" style="width:100%; padding:15px; background:transparent; color:#f44; border:1px solid #f44; margin-top:20px; font-weight:bold;">リセット</button>
    </div>
</div>

<!-- 管理画面（設定画面の🔑から）。設定画面より後ろに置く＝手前に重なる -->
<div id="admin-modal" class="modal">
    <div class="modal-header">
        <div class="header-icon" style="visibility:hidden; pointer-events:none;">✕</div>
        <div class="modal-title">管理画面</div>
        <div class="header-icon" onclick="closeModal('admin-modal')">✕</div>
    </div>
    <div class="modal-body">
        <p class="section-title" style="margin-top:20px;">＜操作ログ＞</p>
        <pre id="tap-log" class="tap-log">（まだありません）</pre>

        <p class="section-title" style="margin-top:20px;">＜スプレッドシート連携＞</p>
        <input type="text" class="gas-input" id="gas-url" placeholder="GAS WebアプリのURL" onchange="saveGasConfig()" value="">
        <input type="text" class="gas-input" id="gas-token" placeholder="トークン" onchange="saveGasConfig()" value="" style="margin-top:6px;">
    </div>
</div>

<!-- 古いタブの案内（ショートカットの URL 送信で新しいタブが開いたとき）。最前面 -->
<div id="stale-tab">
    <div class="stale-box">
        <div class="stale-title">このタブは古くなっています</div>
        <div class="stale-msg">新しいタブでカウンターが開かれました。<br>データを守るため、このタブでは保存しません。<br>このタブは閉じてください。</div>
        <button class="stale-btn" onclick="location.reload()">このタブで続ける（再読み込み）</button>
    </div>
</div>

<script>
    // ダブルタップの拡大を止める
    document.addEventListener('dblclick', function(e) { e.preventDefault(); }, { passive: false });

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // storage-and-tabs.js / tap-and-haptic.js / sheet-sync.js をここに

    window.onload = () => startup();
</script>
</body>
</html>
